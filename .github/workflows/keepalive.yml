name: Supabase keep-alive

# Supabase pauses free projects after about a week with no activity.
# This asks the database for one row twice a week so ArcWright stays awake.
on:
  schedule:
    - cron: '17 14 * * 1,4'   # Mondays and Thursdays, about 10 AM Eastern
  workflow_dispatch:          # adds a "Run workflow" button for testing

permissions:
  actions: write              # lets the last step keep this schedule switched on

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://yyodnslnfuacgvpfezkl.supabase.co
          SUPABASE_KEY: sb_publishable_Kg1tWGqS-jRXokqMxyoKbg_neRS-dfD
        run: |
          code=$(curl -s -o response.txt -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/arcwright_projects?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "Supabase answered HTTP $code"
          cat response.txt; echo
          if [ "$code" != "200" ]; then exit 1; fi

      - name: Keep this schedule switched on
        # GitHub turns off scheduled workflows in repos with no commits for 60 days.
        # Re-enabling the workflow each run resets that clock.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
